apiVersion: v1
kind: ConfigMap

metadata:
    name: otel-collector-config
    namespace: inventorysystem

data:
    otel-collector-config.yaml: |

        receivers:
            otlp:
                protocols:
                    grpc:
                        endpoint: 0.0.0.0:4317
                    http:
                        endpoint: 0.0.0.0:4318

        processors:
            batch:

        extensions:
            health_check:
                endpoint: 0.0.0.0:13133

        exporters:
            debug: {}
            otlp/jaeger:
                endpoint: jaeger:4317
                tls:
                    insecure: true

        service:
            extensions: [health_check]                    

            pipelines:
                traces:
                    receivers: [otlp]
                    processors: [batch]
                    exporters: [debug, otlp/jaeger]

                metrics:
                    receivers: [otlp]
                    processors: [batch]
                    exporters: [debug]

                logs:
                    receivers: [otlp]
                    processors: [batch]
                    exporters: [debug]