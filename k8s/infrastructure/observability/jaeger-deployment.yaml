apiVersion: apps/v1
kind: Deployment

metadata:
  name: jaeger
  namespace: inventorysystem

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jaeger

  template:
    metadata:
      labels:
        app: jaeger

    spec:
      containers:

      - name: jaeger
        image: jaegertracing/all-in-one:1.58

        args:
          - "--collector.otlp.enabled=true"

        ports:
          - containerPort: 16686
          - containerPort: 4317
          - containerPort: 4318