apiVersion: apps/v1
kind: Deployment

metadata:
    name: jaeger
    namespace: inventorysystem

spec:
    replicas: 1

    selector:
        matchLabels:
            app: jaeger

    template:
        metadata:
            labels:
                app: jaeger

        spec:
            containers:
              - name: jaeger                
                image: jaegertracing/all-in-one:1.71.0
                imagePullPolicy: IfNotPresent
                
                env:
                  - name: COLLECTOR_OTLP_ENABLED
                    value: "true"

                ports:
                  - name: ui
                    containerPort: 16686
                  - name: grpc
                    containerPort: 4317
                  - name: http
                    containerPort: 4318
                  - name: zipkin
                    containerPort: 9411