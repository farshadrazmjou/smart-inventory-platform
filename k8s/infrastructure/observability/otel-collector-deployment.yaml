apiVersion: apps/v1
kind: Deployment

metadata:
  name: otel-collector
  namespace: inventorysystem

spec:
  replicas: 1

  selector:
    matchLabels:
      app: otel-collector

  template:
    metadata:
      labels:
        app: otel-collector

    spec:
      containers:

      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.129.1

        args:
          - "--config=/etc/otelcol-contrib/otel-collector-config.yaml"

        ports:
          - containerPort: 4317
          - containerPort: 4318

        volumeMounts:
          - name: collector-config
            mountPath: /etc/otelcol-contrib

      volumes:
        - name: collector-config
          configMap:
            name: otel-collector-config