version: '3.9'

services:

    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq

        ports:
            - "5672:5672"
            - "15672:15672"

        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
            
    sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: sqlserver

        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"

        ports:
            - "1433:1433"

        volumes:
            - sqlserver_data:/var/opt/mssql
            
        healthcheck:
            test: ["CMD-SHELL","/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    redis:
        image: redis:7-alpine
        container_name: redis
        
        ports:
            - "6379:6379"

    authservice:
        build:
            context: ./src/Services/AuthService

        container_name: authservice

        ports:
            - "5134:8080"

        depends_on:
            sqlserver:
                condition: service_healthy

        environment:
            ASPNETCORE_ENVIRONMENT: Docker
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__DefaultConnection: Server=sqlserver;Database=AuthDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;


    productservice:
        build:
            context: ./src/Services/ProductService

        container_name: productservice

        ports:
            - "5192:8080"

        depends_on:
            sqlserver:
                condition: service_healthy
            redis:
                condition: service_started

        environment:
            ASPNETCORE_ENVIRONMENT: Docker
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__DefaultConnection: Server=sqlserver;Database=ProductDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
            redis__ConnectionStrings: redis:6379


    apigateway:
        build:
            context: ./src/ApiGateway

        container_name: apigateway

        ports:
            - "5118:8080"

        depends_on:
            - authservice
            - productservice

        environment:
            ASPNETCORE_ENVIRONMENT: Docker
            ASPNETCORE_URLS: http://+:8080


volumes:
    sqlserver_data: