version: '3.9'

services:
    seq:
        image: datalust/seq:latest
        container_name: seq

        environment:
            ACCEPT_EULA: "Y"
            SEQ_FIRSTRUN_ADMINPASSWORD: "P@ssw0rd"

        ports:
            - "8081:80"
            - "5341:5341"

        volumes:
            - seq_data:/data
            
    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq

        ports:
            - "5672:5672"
            - "15672:15672"

        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
            
        healthcheck:
            test : ["CMD","rabbitmq-diagnostics","-q","ping"]
            interval : 10s
            timeout : 5s
            retries : 5
            start_period : 15s
            
    sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: sqlserver

        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"

        ports:
            - "1433:1433"

        volumes:
            - sqlserver_data:/var/opt/mssql
            
        healthcheck:
            test: ["CMD-SHELL","/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    redis:
        image: redis:7-alpine
        container_name: redis
        
        ports:
            - "6379:6379"
            
    notificationservice:
        build:
            context: .
            dockerfile: Dockerfiles/NotificationService.Dockerfile

        container_name: notificationservice

        depends_on:
            rabbitmq:
                condition : service_healthy

        environment:
            ASPNETCORE_ENVIRONMENT: Docker
            RabbitMq__Host: rabbitmq
            RabbitMq__UserName: guest
            RabbitMq__Password: guest
            
        restart : unless-stopped
            
    authservice:
        build:
            context: .
            dockerfile: Dockerfiles/AuthService.Dockerfile

        container_name: authservice

        ports:
            - "5134:8080"

        depends_on:
            sqlserver:
                condition: service_healthy

        environment:
            ASPNETCORE_ENVIRONMENT: Docker
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__DefaultConnection: Server=sqlserver;Database=AuthDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;


    productservice:
        build:
            context: .
            dockerfile: Dockerfiles/ProductService.Dockerfile

        container_name: productservice

        ports:
            - "5192:8080"

        depends_on:
            sqlserver:
                condition: service_healthy
            redis:
                condition: service_started
            rabbitmq:
                condition: service_started

        environment:
            ASPNETCORE_ENVIRONMENT: Docker
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__DefaultConnection: Server=sqlserver;Database=ProductDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
            redis__ConnectionStrings: redis:6379
            RabbitMq__Host: rabbitmq
            RabbitMq__UserName: guest
            RabbitMq__Password: guest


    apigateway:
        build:
            context: .
            dockerfile: Dockerfiles/ApiGateway.Dockerfile

        container_name: apigateway

        ports:
            - "5118:8080"

        depends_on:
            - authservice
            - productservice

        environment:
            ASPNETCORE_ENVIRONMENT: Docker
            ASPNETCORE_URLS: http://+:8080


volumes:
    sqlserver_data:
    seq_data: